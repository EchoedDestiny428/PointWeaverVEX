<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PointWeaver</title>
    <meta name="description" content="Plays a VEX LemLib autonomous routine top-down on the field and flags collisions." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2309090b'/%3E%3Cpath d='M6.5 17.5C12 17.5 12 6.5 17.5 6.5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='6.5' cy='17.5' r='2' fill='%23fff'/%3E%3Ccircle cx='17.5' cy='6.5' r='2' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app" id="app">
      <header class="bar">
        <div class="brand" title="PointWeaver">
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" rx="6" />
            <path d="M6.5 17.5C12 17.5 12 6.5 17.5 6.5" />
            <circle cx="6.5" cy="17.5" r="2" />
            <circle cx="17.5" cy="6.5" r="2" />
          </svg>
          <span class="brand-name">PointWeaver</span>
        </div>
        <button class="pill folder" id="open-folder" type="button" data-icon="FolderOpen" title="Open a PROS project folder">
          <span id="project-name">Open folder</span>
          <span class="live" id="live" hidden title="Watching for saves"></span>
        </button>
        <label class="icon-btn" id="open-file" for="file-input" title="Open a single .cpp file" data-icon="FileCode" hidden></label>
        <input id="folder-input" type="file" webkitdirectory multiple hidden />
        <input id="file-input" type="file" accept=".cpp,.cc,.cxx,.txt" hidden />
        <div class="spacer"></div>
        <div class="metrics">
          <span class="metric" id="m-time" data-icon="Timer" title="Run time"><b>–</b></span>
          <button class="metric" id="m-hits" type="button" data-icon="OctagonAlert" title="Collisions"><b>–</b></button>
          <button class="metric" id="m-timeouts" type="button" data-icon="TimerOff" title="Moves that timed out"><b>–</b></button>
          <button class="metric" id="m-warn" type="button" data-icon="TriangleAlert" title="Lines that were skipped"><b>–</b></button>
        </div>
        <button class="icon-btn" id="theme" type="button" title="Theme"></button>
      </header>

      <nav class="side" aria-label="Routines">
        <div class="side-scroll" id="routine-list"></div>
      </nav>

      <main class="stage">
        <div class="field-wrap" id="field-wrap">
          <svg id="field" viewBox="-80 -74 160 152" role="img" aria-label="Field"></svg>
          <ul class="now" id="now"></ul>
          <span class="over" id="over" hidden></span>
          <span class="coords" id="coords"></span>
          <span class="toast" id="toast" data-icon="RefreshCw"><span id="toast-text"></span></span>
        </div>
        <div class="transport">
          <button class="icon-btn solid" id="play" type="button" title="Play (Space)" data-icon="Play"></button>
          <button class="icon-btn" id="restart" type="button" title="Restart (Home)" data-icon="RotateCcw"></button>
          <div class="scrub">
            <div class="scrub-marks" id="scrub-marks"></div>
            <input id="scrubber" type="range" min="0" max="0" value="0" step="any" aria-label="Time" />
          </div>
          <span class="clock"><b id="clock-now">0.00</b><span id="clock-total"></span></span>
          <button class="pill mono" id="speed" type="button" title="Playback speed">1×</button>
          <div class="seg" id="period" role="group" aria-label="Time limit">
            <button type="button" data-period="15" title="Match autonomous">15s</button>
            <button type="button" data-period="60" title="Skills">60s</button>
          </div>
        </div>
      </main>

      <aside class="inspector">
        <div class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" data-tab="timeline" data-icon="ListOrdered" title="Timeline"></button>
          <button class="tab" type="button" role="tab" data-tab="collisions" data-icon="OctagonAlert" title="Collisions">
            <span class="badge" id="badge-collisions"></span>
          </button>
          <button class="tab" type="button" role="tab" data-tab="code" data-icon="CodeXml" title="Code">
            <span class="badge warn" id="badge-code"></span>
          </button>
          <button class="tab" type="button" role="tab" data-tab="settings" data-icon="SlidersHorizontal" title="Settings"></button>
        </div>
        <section class="pane" data-pane="timeline">
          <ul class="list" id="timeline"></ul>
        </section>
        <section class="pane" data-pane="collisions">
          <ul class="list" id="collisions"></ul>
        </section>
        <section class="pane" data-pane="code">
          <div class="code-head">
            <span class="code-file" id="code-file" data-icon="FileCode"></span>
            <button class="icon-btn" id="reveal" type="button" title="Open in editor" data-icon="SquareArrowOutUpRight" hidden></button>
          </div>
          <ul class="diagnostics" id="diagnostics"></ul>
          <div class="code" id="code"></div>
        </section>
        <section class="pane" data-pane="settings">
          <div class="set">
            <h3>Count as collisions</h3>
            <div class="toggles" id="obstacle-toggles"></div>
          </div>
          <div class="set">
            <h3>Robot</h3>
            <div class="grid2" id="robot-fields"></div>
          </div>
          <div class="set">
            <h3>Macro time</h3>
            <div class="rows" id="mechanism-fields"></div>
          </div>
          <button class="pill" id="reset-settings" type="button" data-icon="Undo2">Reset</button>
        </section>
      </aside>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
